plugins { id 'com.android.application' }

android {
    namespace 'com.playnova.arcade'
    compileSdk 35

    defaultConfig {
        applicationId 'com.playnova.arcade'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.3.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
